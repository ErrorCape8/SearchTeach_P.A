services:
  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a private value of at least 32 bytes}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      MONGODB_URI: mongodb://mongodb:27017/Searchteach
      REDIS_HOST: redis
      REDIS_PORT: 6379

  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:4.6
    profiles: ["webrtc"]
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET:-local-dev-only-secret}"
      - "--realm=${TURN_REALM:-localhost}"
      - "--external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  mongodb_data:
  redis_data:
