services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  coturn:
    image: coturn/coturn:4.6
    profiles: ["webrtc"]
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET:-local-dev-only-secret}"
      - "--realm=${TURN_REALM:-localhost}"
      - "--external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  mongodb_data:
  redis_data:
