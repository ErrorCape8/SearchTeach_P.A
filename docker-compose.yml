services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a private value of at least 32 bytes}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      DIRECTOR_IDS: ${DIRECTOR_IDS:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/Searchteach}
      SPRING_DATA_REDIS_URL: ${SPRING_DATA_REDIS_URL:-redis://redis:6379}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6
    profiles: ["webrtc"]
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET:-local-dev-only-secret}"
      - "--realm=${TURN_REALM:-localhost}"
      - "--external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  mongodb_data:
