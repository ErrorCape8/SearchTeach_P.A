name: searchteach_mobile
description: Flutter app for SearchTeach.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  web_socket_channel: ^3.0.2
  permission_handler: ^11.4.0
  intl: ^0.19.0
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  web: ^1.1.1
  livekit_client: 2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
