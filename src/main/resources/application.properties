spring.config.import=optional:file:.env[.properties]
spring.application.name=searchteach
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/Searchteach}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.auth.jwt.secret=${JWT_SECRET:}
app.auth.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.auth.attempts.max-per-identifier=${AUTH_MAX_ATTEMPTS_PER_IDENTIFIER:5}
app.auth.attempts.max-per-ip=${AUTH_MAX_ATTEMPTS_PER_IP:20}
app.auth.attempts.window-seconds=${AUTH_ATTEMPT_WINDOW_SECONDS:900}
