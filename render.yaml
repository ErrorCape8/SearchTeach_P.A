services:
  - type: keyvalue
    name: searchteach-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: searchteach-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: SearchTeach
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: searchteach-redis
          property: connectionString
      - key: FIREBASE_PUSH_ENABLED
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms128m -Xmx384m"

  - type: web
    name: searchteach-frontend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./flutter/Dockerfile
    dockerContext: .
    dockerBuildArgs:
      - API_BASE_URL
      - FIREBASE_API_KEY
      - FIREBASE_APP_ID
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_PROJECT_ID
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_STORAGE_BUCKET
      - FIREBASE_WEB_VAPID_KEY
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: searchteach-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_WEB_VAPID_KEY
        sync: false
